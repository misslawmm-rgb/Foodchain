<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>街機食物鏈模擬器 Food Chain Arcade Simulator</title>
    <!-- Tailwind CSS 與 街機像素字型 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@600;800;900&display=swap" rel="stylesheet" />
    
    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #080711;
        color: #ffffff;
      }
      .pixel-font {
        font-family: 'Press Start 2P', monospace;
      }

      /* 復古街機邊框 */
      .arcade-card {
        background: #0f172a;
        border: 4px solid #00f0ff;
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      }

      .arcade-btn {
        transition: all 0.15s ease;
        box-shadow: 0 4px 0 #000;
      }
      .arcade-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #000;
      }

      /* 物種放置 Slot */
      .slot-card {
        width: 140px;
        height: 200px;
        border: 3px dashed #00f0ff;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: all 0.2s;
      }
      .slot-card.drag-over {
        border-color: #ff007f;
        background: rgba(255, 0, 127, 0.2);
        transform: scale(1.03);
      }

      /* 箭嘴放置 Slot */
      .slot-arrow {
        width: 70px;
        height: 70px;
        border: 3px dashed #ff007f;
        border-radius: 50%;
        background: rgba(30, 10, 40, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .slot-arrow.drag-over {
        border-color: #ffe600;
        background: rgba(255, 230, 0, 0.2);
        transform: scale(1.1);
      }

      /* 生物卡片 */
      .card {
        width: 130px;
        height: 190px;
        background: #1e293b;
        border: 3px solid #ffe600;
        border-radius: 10px;
        cursor: grab;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 6px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      }
      .card:active {
        cursor: grabbing;
      }
      .card-img-container {
        width: 100%;
        height: 110px;
        border-radius: 6px;
        border: 2px solid #00f0ff;
        overflow: hidden;
        background: #090d16;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-img-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card-title {
        font-size: 13px;
        font-weight: 900;
        color: #ffffff;
        margin-top: 8px;
        text-align: center;
        text-shadow: 2px 2px 0px #000;
      }

      /* 可拖拉箭嘴塊 */
      .draggable-arrow {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff007f 0%, #b80058 100%);
        border: 3px solid #ffffff;
        color: #ffffff;
        font-size: 28px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        box-shadow: 0 0 12px #ff007f;
        user-select: none;
      }
      .draggable-arrow:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 relative">

    <header class="w-full max-w-4xl arcade-card rounded-2xl p-3 sm:p-4 mb-3 flex flex-wrap items-center justify-between gap-3 border-4 border-cyan-400">
      <div class="flex items-center gap-2 bg-yellow-400 text-black px-3 py-1.5 rounded-xl font-black shadow">
        <span class="text-xl">🕹️</span>
        <h1 class="pixel-font text-xs sm:text-sm tracking-wider">FOOD CHAIN ARCADE</h1>
      </div>

      <div class="flex items-center gap-3 sm:gap-6 pixel-font text-xs">
        <!-- 3 顆心生命值 -->
        <div class="bg-black/80 px-3 py-2 rounded-lg border-2 border-red-500 text-red-400 flex items-center gap-1 shadow">
          LIFE: <span id="lives-display" class="text-base">❤️❤️❤️</span>
        </div>
        <div class="bg-black/80 px-3 py-2 rounded-lg border-2 border-cyan-400 text-cyan-300 shadow">
          STAGE: <span id="level-display" class="text-yellow-300">1/4</span>
        </div>
        <div class="bg-black/80 px-3 py-2 rounded-lg border-2 border-green-400 text-green-300 shadow">
          SCORE: <span id="score-display" class="text-yellow-300">0</span>
        </div>
        <button id="bgm-toggle" onclick="toggleBGM()" class="arcade-btn bg-purple-700 hover:bg-purple-600 border-2 border-purple-300 text-white px-3 py-2 rounded-lg text-[10px]">
          🎵 <span id="bgm-status">BGM: 關</span>
        </button>
      </div>
    </header>

    <main class="w-full max-w-4xl arcade-card rounded-2xl p-4 sm:p-6 flex-1 flex flex-col justify-between border-4 border-cyan-400">
      
      <!-- 關卡標題與明確操作指引 -->
      <div class="text-center mb-3 bg-slate-900/90 p-3 rounded-xl border-2 border-cyan-500 shadow">
        <h2 id="level-title" class="pixel-font text-sm sm:text-base text-yellow-300 mb-1">
          STAGE 1
        </h2>
        <p class="text-sm sm:text-base text-cyan-200 font-extrabold">
          請將【生物卡片】與【能量箭嘴】拖拉放入下方對應位置中！
        </p>
      </div>

      <!-- 拖拉箭嘴工具區 (ARROW POOL) -->
      <div class="bg-slate-900/80 border-2 border-pink-500 rounded-xl p-3 mb-4 flex flex-col items-center">
        <div class="text-xs text-pink-400 font-black pixel-font mb-2 tracking-wider flex items-center gap-2">
          ⬇️ 箭嘴工具箱（請將箭嘴拖拉至生物之間）：
        </div>
        <div class="flex items-center gap-8">
          <div class="flex flex-col items-center gap-1">
            <div class="draggable-arrow" draggable="true" data-arrow="➔">➔</div>
            <span class="text-[11px] font-bold text-slate-300">向右 (➔)</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <div class="draggable-arrow" draggable="true" data-arrow="⬅">⬅</div>
            <span class="text-[11px] font-bold text-slate-300">向左 (⬅)</span>
          </div>
        </div>
      </div>

      <!-- 食物鏈放置區 (Slots) -->
      <div class="grid grid-cols-1 md:grid-cols-5 items-center justify-items-center gap-2 my-2">
        
        <!-- Slot Position 1 (生產者) -->
        <div class="flex flex-col items-center gap-1">
          <span class="bg-emerald-500/90 text-black px-2.5 py-0.5 rounded-full text-xs font-black shadow border border-white">生產者</span>
          <div class="slot-card" data-slot-type="card" data-slot-index="0">
            <span class="text-xs text-cyan-300 font-extrabold text-center">拖入生物卡</span>
          </div>
        </div>

        <!-- Arrow Slot 1 -->
        <div class="flex flex-col items-center justify-center my-2 md:my-0 self-center md:mt-6">
          <div class="slot-arrow" data-slot-type="arrow" data-slot-index="0">
            <span class="text-xs text-pink-400 font-bold">拖入箭嘴</span>
          </div>
          <span class="text-[10px] font-black text-pink-400 mt-1">能量流向</span>
        </div>

        <!-- Slot Position 2 (草食動物) -->
        <div class="flex flex-col items-center gap-1">
          <span class="bg-amber-400 text-black px-2.5 py-0.5 rounded-full text-xs font-black shadow border border-white">草食動物</span>
          <div class="slot-card" data-slot-type="card" data-slot-index="1">
            <span class="text-xs text-cyan-300 font-extrabold text-center">拖入生物卡</span>
          </div>
        </div>

        <!-- Arrow Slot 2 -->
        <div class="flex flex-col items-center justify-center my-2 md:my-0 self-center md:mt-6">
          <div class="slot-arrow" data-slot-type="arrow" data-slot-index="1">
            <span class="text-xs text-pink-400 font-bold">拖入箭嘴</span>
          </div>
          <span class="text-[10px] font-black text-pink-400 mt-1">能量流向</span>
        </div>

        <!-- Slot Position 3 (肉食動物) -->
        <div class="flex flex-col items-center gap-1">
          <span class="bg-rose-500 text-white px-2.5 py-0.5 rounded-full text-xs font-black shadow border border-white">肉食動物</span>
          <div class="slot-card" data-slot-type="card" data-slot-index="2">
            <span class="text-xs text-cyan-300 font-extrabold text-center">拖入生物卡</span>
          </div>
        </div>

      </div>

      <!-- 生物卡片池 (SPECIES CARD POOL) -->
      <div class="mt-3">
        <div class="text-xs text-yellow-400 pixel-font mb-2 text-center tracking-widest">
          ▼ SPECIES CARD POOL ▼
        </div>
        <div id="cards-pool" class="min-h-[200px] bg-slate-950/90 border-2 border-cyan-500 rounded-xl p-3 flex flex-wrap justify-center items-center gap-4 shadow-inner">
          <!-- JS 動態生成 -->
        </div>
      </div>

      <!-- 按鈕區 -->
      <div class="flex justify-center gap-6 mt-4">
        <button onclick="resetCurrentLevel()" class="arcade-btn bg-red-600 hover:bg-red-500 text-white font-black border-2 border-white px-6 py-2.5 rounded-xl text-xs pixel-font">
          🔄 RESET
        </button>
        <button onclick="checkAnswer()" class="arcade-btn bg-emerald-400 hover:bg-emerald-300 text-black font-black border-2 border-white px-8 py-2.5 rounded-xl text-xs pixel-font shadow-[0_0_15px_#00ffcc]">
          🚀 SUBMIT
        </button>
      </div>

    </main>

    <!-- 結果彈窗 Modal -->
    <div id="modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div id="modal-box" class="max-w-md w-full bg-slate-900 border-4 border-cyan-400 rounded-2xl p-6 text-center shadow-[0_0_30px_#00ffcc]">
        <h3 id="modal-title" class="pixel-font text-base text-yellow-300 mb-3">RESULT</h3>
        <p id="modal-text" class="text-sm sm:text-base text-gray-100 leading-relaxed mb-5 text-left bg-black/80 p-4 rounded-xl border border-slate-700 font-bold whitespace-pre-line">
          提示內容
        </p>
        <div id="modal-btn-group" class="flex justify-center gap-3 flex-wrap">
          <button id="modal-btn" onclick="closeModal()" class="arcade-btn bg-cyan-400 hover:bg-cyan-300 text-black font-black border-2 border-white px-6 py-2.5 rounded-xl text-xs pixel-font">
            OK
          </button>
        </div>
      </div>
    </div>

    <!-- 4條食物鏈總成績檢查 Modal -->
    <div id="summary-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
      <div class="max-w-lg w-full bg-slate-900 border-4 border-yellow-400 rounded-2xl p-6 text-center shadow-[0_0_30px_#ffe600] max-h-[90vh] overflow-y-auto">
        <h3 class="pixel-font text-base sm:text-lg text-yellow-300 mb-2">🏆 通關總成績單</h3>
        <p class="text-xs text-cyan-300 font-bold mb-4">恭喜完成所有關卡！以下為你組裝的 4 條生態食物鏈：</p>
        
        <div id="summary-list" class="space-y-3 text-left mb-6">
          <!-- JS 動態生成 4 條食物鏈 -->
        </div>

        <div class="flex justify-center gap-4 flex-wrap">
          <button onclick="closeSummaryModal(); restartGame();" class="arcade-btn bg-emerald-400 hover:bg-emerald-300 text-black font-black border-2 border-white px-6 py-2.5 rounded-xl text-xs pixel-font">
            🔄 重新再來
          </button>
          <button onclick="closeSummaryModal()" class="arcade-btn bg-slate-700 hover:bg-slate-600 text-white font-black border-2 border-white px-6 py-2.5 rounded-xl text-xs pixel-font">
            ❌ 關閉視窗
          </button>
        </div>
      </div>
    </div>

    <script>
      // 真實圖片網址庫（使用穩定可靠的網絡圖片 URL）
      const speciesImages = {
        grass: "https://images.unsplash.com/photo-1533460004989-cef01064af7e?auto=format&fit=crop&w=400&q=80",
        zebra: "https://upload.wikimedia.org/wikipedia/commons/f/f0/Zebra_standing_alone_crop.jpg?utm_source=zh-yue.wikipedia.org&utm_campaign=index&utm_content=original",
        lion: "https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?auto=format&fit=crop&w=400&q=80",
        acacia_leaf: "https://regionmedia.com.cn/wp-content/uploads/2024/08/Early-Black-Wattle-in-full-golden-bloom-against-its-dark-green-foliage.jpg",
        giraffe: "https://images.unsplash.com/photo-1547721064-da6cfb341d50?auto=format&fit=crop&w=400&q=80",
        tender_grass: "https://upload.wikimedia.org/wikipedia/commons/4/43/Pasture_grass_land.jpg?utm_source=zh-yue.wikipedia.org&utm_campaign=index&utm_content=original",
        impala: "https://upload.wikimedia.org/wikipedia/commons/0/0d/Western_Serengeti_2012_06_03_3630_%287557828010%29.jpg?utm_source=zh.wikipedia.org&utm_campaign=index&utm_content=original",
        cheetah: "https://res.klook.com/images/w_1200,h_630,c_fill,q_65/w_80,x_15,y_15,g_south_west,l_Klook_water_br_trans_yhcmh3/activities/e96mj5lp5n1ck4qusx5j/%E8%8E%AB%E7%B4%8D%E8%A8%97%E9%87%8E%E7%94%9F%E5%8B%95%E7%89%A9%E5%9C%92%E7%8D%B5%E8%B1%B9%E9%AB%94%E9%A9%97.jpg",
        buffalo: "https://www.shutterstock.com/shutterstock/videos/3539821067/thumb/1.jpg?ip=x480"
      };

      const levels = [
        {
          id: 1,
          title: "STAGE 1",
          cards: [
            { id: 'grass', name: '草原青草', img: speciesImages.grass, correctPos: 0 },
            { id: 'zebra', name: '斑馬', img: speciesImages.zebra, correctPos: 1 },
            { id: 'lion', name: '獅子', img: speciesImages.lion, correctPos: 2 }
          ],
          correctArrows: ['➔', '➔'],
          hint: "【科學提示】\n食物鏈能量傳遞方向為「被吃者 ➔ 食用者」：\n1. 青草（生產者）利用陽光製造養分。\n2. 斑馬（草食動物）取食青草獲得能量。\n3. 獅子（肉食動物）捕食斑馬獲得能量。"
        },
        {
          id: 2,
          title: "STAGE 2",
          cards: [
            { id: 'acacia_leaf', name: '金合歡樹葉', img: speciesImages.acacia_leaf, correctPos: 0 },
            { id: 'giraffe', name: '長頸鹿', img: speciesImages.giraffe, correctPos: 1 },
            { id: 'lion2', name: '獅子', img: speciesImages.lion, correctPos: 2 }
          ],
          correctArrows: ['➔', '➔'],
          hint: "【科學提示】\n1. 金合歡樹葉（生產者）。\n2. 長頸鹿（草食動物）取食高處樹葉。\n3. 獅子（肉食動物）捕食長頸鹿。"
        },
        {
          id: 3,
          title: "STAGE 3",
          cards: [
            { id: 'tender_grass', name: '嫩草', img: speciesImages.tender_grass, correctPos: 0 },
            { id: 'impala', name: '黑斑羚羊', img: speciesImages.impala, correctPos: 1 },
            { id: 'cheetah', name: '獵豹', img: speciesImages.cheetah, correctPos: 2 }
          ],
          correctArrows: ['➔', '➔'],
          hint: "【科學提示】\n1. 嫩草（生產者）。\n2. 黑斑羚羊（草食動物）。\n3. 獵豹（頂級肉食動物）。"
        },
        {
          id: 4,
          title: "STAGE 4",
          cards: [
            { id: 'stage4_grass', name: '草', img: speciesImages.tender_grass, correctPos: 0 },
            { id: 'buffalo', name: '水牛', img: speciesImages.buffalo, correctPos: 1 },
            { id: 'lion3', name: '獅子', img: speciesImages.lion, correctPos: 2 }
          ],
          correctArrows: ['➔', '➔'],
          hint: "【科學提示】\n1. 草（生產者）。\n2. 水牛（草食動物）。\n3. 獅子（肉食動物）。"
        }
      ];

      let currentLevelIdx = 0;
      let score = 0;
      let lives = 3;
      let draggedElement = null;
      let dragType = null; // 'card' or 'arrow'
      let isBgmPlaying = false;
      let bgmInterval = null;

      // Web Audio API 音效引擎
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function initAudio() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playSFX(type) {
        initAudio();
        const now = audioCtx.currentTime;

        if (type === 'drag') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'correct') {
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          freqs.forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0.1, now + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.01, now + i * 0.08 + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.12);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.setValueAtTime(110, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        }
      }

      // 8-Bit Chiptune 背景音樂
      const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 587.33, 440.00, 349.23];
      let noteIdx = 0;

      function playBgmNote() {
        if (!isBgmPlaying) return;
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(melody[noteIdx], now);
        gain.gain.setValueAtTime(0.02, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
        noteIdx = (noteIdx + 1) % melody.length;
      }

      function toggleBGM() {
        initAudio();
        isBgmPlaying = !isBgmPlaying;
        const bgmBtnText = document.getElementById('bgm-status');
        if (isBgmPlaying) {
          bgmBtnText.innerText = 'BGM: 開';
          bgmInterval = setInterval(playBgmNote, 170);
        } else {
          bgmBtnText.innerText = 'BGM: 關';
          clearInterval(bgmInterval);
        }
      }

      function updateLivesDisplay() {
        let hearts = '';
        for (let i = 0; i < lives; i++) hearts += '❤️';
        document.getElementById('lives-display').innerText = hearts || '💀';
      }

      function loadLevel(idx) {
        const level = levels[idx];
        document.getElementById('level-display').innerText = `${idx + 1}/${levels.length}`;
        document.getElementById('level-title').innerText = level.title;
        updateLivesDisplay();

        // 重置 Slot
        document.querySelectorAll('[data-slot-type="card"]').forEach((slot) => {
          slot.innerHTML = `
            <span class="text-xs text-cyan-300 font-extrabold text-center">拖入生物卡</span>
          `;
        });

        document.querySelectorAll('[data-slot-type="arrow"]').forEach((slot) => {
          slot.innerHTML = `<span class="text-xs text-pink-400 font-bold">拖入箭嘴</span>`;
          delete slot.dataset.value;
        });

        // 洗牌卡片
        const pool = document.getElementById('cards-pool');
        pool.innerHTML = '';
        const shuffled = [...level.cards].sort(() => Math.random() - 0.5);

        shuffled.forEach(cardData => {
          const card = document.createElement('div');
          card.className = 'card';
          card.draggable = true;
          card.dataset.id = cardData.id;
          card.dataset.correctPos = cardData.correctPos;
          card.innerHTML = `
            <div class="card-img-container">
              <img src="${cardData.img}" alt="${cardData.name}" onerror="this.onerror=null; this.src='https://placehold.co/130x110/1e293b/00f0ff?text=${encodeURIComponent(cardData.name)}';"/>
            </div>
            <div class="card-title">${cardData.name}</div>
          `;

          card.addEventListener('dragstart', (e) => {
            initAudio();
            draggedElement = card;
            dragType = 'card';
            playSFX('drag');
          });

          pool.appendChild(card);
        });
      }

      // 箭嘴工具箱拖拉綁定
      document.querySelectorAll('.draggable-arrow').forEach(arrowBtn => {
        arrowBtn.addEventListener('dragstart', (e) => {
          initAudio();
          draggedElement = arrowBtn.dataset.arrow;
          dragType = 'arrow';
          playSFX('drag');
        });
      });

      // 設定放置區拖拉事件
      document.querySelectorAll('[data-slot-type]').forEach(slot => {
        slot.addEventListener('dragover', (e) => {
          e.preventDefault();
          const targetType = slot.dataset.slotType;
          if (dragType === targetType) slot.classList.add('drag-over');
        });

        slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));

        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          slot.classList.remove('drag-over');
          const targetType = slot.dataset.slotType;

          if (dragType === targetType) {
            playSFX('drag');
            if (targetType === 'card') {
              const pool = document.getElementById('cards-pool');
              const existingCard = slot.querySelector('.card');
              if (existingCard) pool.appendChild(existingCard);
              slot.appendChild(draggedElement);
            } else if (targetType === 'arrow') {
              slot.innerHTML = `
                <div class="draggable-arrow text-2xl font-black">${draggedElement}</div>
              `;
              slot.dataset.value = draggedElement;
            }
          }
        });
      });

      // 允許把卡片拖回卡片池
      const pool = document.getElementById('cards-pool');
      pool.addEventListener('dragover', (e) => e.preventDefault());
      pool.addEventListener('drop', (e) => {
        e.preventDefault();
        if (dragType === 'card' && draggedElement) {
          playSFX('drag');
          pool.appendChild(draggedElement);
        }
      });

      function checkAnswer() {
        const cardSlots = document.querySelectorAll('[data-slot-type="card"]');
        const arrowSlots = document.querySelectorAll('[data-slot-type="arrow"]');
        
        let placedCards = 0;
        let isCardsCorrect = true;

        cardSlots.forEach((slot, idx) => {
          const card = slot.querySelector('.card');
          if (card) {
            placedCards++;
            if (parseInt(card.dataset.correctPos) !== idx) isCardsCorrect = false;
          } else {
            isCardsCorrect = false;
          }
        });

        if (placedCards < 3) {
          playSFX('wrong');
          showModal('提醒 ⚠️', '請將 3 張生物卡片全部拖放至槽位中！', false);
          return;
        }

        let placedArrows = 0;
        let isArrowsCorrect = true;
        const level = levels[currentLevelIdx];

        arrowSlots.forEach((slot, idx) => {
          const arrowVal = slot.dataset.value;
          if (arrowVal) {
            placedArrows++;
            if (arrowVal !== level.correctArrows[idx]) isArrowsCorrect = false;
          } else {
            isArrowsCorrect = false;
          }
        });

        if (placedArrows < 2) {
          playSFX('wrong');
          showModal('提醒 ⚠️', '請從上方的【箭嘴工具箱】拖拉箭嘴放置到生物之間！', false);
          return;
        }

        if (isCardsCorrect && isArrowsCorrect) {
          score += 100;
          document.getElementById('score-display').innerText = score;
          playSFX('correct');

          if (currentLevelIdx < levels.length - 1) {
            showModal('STAGE CLEAR! 🎉', `太棒了！生物順序與能量箭嘴方向完全正確！\n獲得分數：+100 分`, true, () => {
              currentLevelIdx++;
              loadLevel(currentLevelIdx);
            });
          } else {
            // 完成第 4 關，提供「檢查成績」與「重新再來」雙選項
            showGameCompleteModal();
          }
        } else {
          lives--;
          updateLivesDisplay();
          playSFX('wrong');

          if (lives <= 0) {
            showModal('GAME OVER 💀', `生命值已耗盡！別灰心，重新挑戰一次吧！`, false, () => {
              restartGame();
            });
          } else {
            let errorMsg = `答案不正確（扣除 1 顆心 ❤️）！\n\n`;
            if (!isCardsCorrect) errorMsg += "❌ 生物排列順序有誤。\n";
            if (!isArrowsCorrect) errorMsg += "❌ 能量箭嘴方向錯誤（記得：能量是由『被吃者』指向『食用者』）。\n";
            errorMsg += `\n${level.hint}`;
            showModal('TRY AGAIN ❌', errorMsg, false);
          }
        }
      }

      function showGameCompleteModal() {
        const modal = document.getElementById('modal');
        const modalBox = document.getElementById('modal-box');
        const titleEl = document.getElementById('modal-title');
        const textEl = document.getElementById('modal-text');
        const btnGroup = document.getElementById('modal-btn-group');

        titleEl.innerText = 'GAME COMPLETED! 🏆';
        textEl.innerText = `太厲害了！你已順利通過全部 4 個食物鏈模擬關卡！\n最終累積得分：${score} 分！\n\n你可以選擇檢查 4 條食物鏈總成績，或是重新開始挑戰！`;

        modalBox.className = 'max-w-md w-full bg-slate-900 border-4 border-yellow-400 rounded-2xl p-6 text-center shadow-[0_0_30px_#ffe600]';

        btnGroup.innerHTML = `
          <button onclick="closeModal(); showSummaryModal();" class="arcade-btn bg-cyan-400 hover:bg-cyan-300 text-black font-black border-2 border-white px-5 py-2.5 rounded-xl text-xs pixel-font">
            📋 檢查成績
          </button>
          <button onclick="closeModal(); restartGame();" class="arcade-btn bg-emerald-400 hover:bg-emerald-300 text-black font-black border-2 border-white px-5 py-2.5 rounded-xl text-xs pixel-font">
            🔄 重新再來
          </button>
        `;

        modal.classList.remove('hidden');
      }

      function showSummaryModal() {
        const summaryList = document.getElementById('summary-list');
        summaryList.innerHTML = '';

        levels.forEach((lvl, idx) => {
          // 依 correctPos 排序，確保顯示正確順序
          const sortedCards = [...lvl.cards].sort((a, b) => a.correctPos - b.correctPos);
          const p = sortedCards[0].name;
          const h = sortedCards[1].name;
          const c = sortedCards[2].name;

          const item = document.createElement('div');
          item.className = 'bg-black/80 border border-slate-700 rounded-xl p-3 flex flex-col gap-1';
          item.innerHTML = `
            <div class="text-xs text-yellow-400 font-black pixel-font">STAGE ${idx + 1}</div>
            <div class="text-sm text-cyan-200 font-bold flex items-center gap-1.5 flex-wrap">
              <span class="bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/50">${p}</span>
              <span class="text-pink-400 font-black">➔</span>
              <span class="bg-amber-950 text-amber-300 px-2 py-0.5 rounded border border-amber-500/50">${h}</span>
              <span class="text-pink-400 font-black">➔</span>
              <span class="bg-rose-950 text-rose-300 px-2 py-0.5 rounded border border-rose-500/50">${c}</span>
            </div>
          `;
          summaryList.appendChild(item);
        });

        document.getElementById('summary-modal').classList.remove('hidden');
      }

      function closeSummaryModal() {
        document.getElementById('summary-modal').classList.add('hidden');
      }

      function restartGame() {
        currentLevelIdx = 0;
        score = 0;
        lives = 3;
        document.getElementById('score-display').innerText = score;
        loadLevel(currentLevelIdx);
      }

      function showModal(title, text, isSuccess, callback = null) {
        const modal = document.getElementById('modal');
        const modalBox = document.getElementById('modal-box');
        const titleEl = document.getElementById('modal-title');
        const textEl = document.getElementById('modal-text');
        const btnGroup = document.getElementById('modal-btn-group');

        titleEl.innerText = title;
        textEl.innerText = text;

        if (isSuccess) {
          modalBox.className = 'max-w-md w-full bg-slate-900 border-4 border-emerald-400 rounded-2xl p-6 text-center shadow-[0_0_30px_#00ff66]';
          btnGroup.innerHTML = `
            <button id="modal-btn" class="arcade-btn bg-emerald-400 hover:bg-emerald-300 text-black border-2 border-white px-6 py-2.5 rounded-xl text-xs font-black pixel-font">
              NEXT STAGE ➔
            </button>
          `;
        } else {
          modalBox.className = 'max-w-md w-full bg-slate-900 border-4 border-rose-500 rounded-2xl p-6 text-center shadow-[0_0_30px_#ff0055]';
          btnGroup.innerHTML = `
            <button id="modal-btn" class="arcade-btn bg-rose-600 hover:bg-rose-500 text-white border-2 border-white px-6 py-2.5 rounded-xl text-xs font-black pixel-font">
              RETRY
            </button>
          `;
        }

        modal.classList.remove('hidden');

        const btn = document.getElementById('modal-btn');
        if (btn) {
          btn.onclick = () => {
            closeModal();
            if (callback) callback();
          };
        }
      }

      function closeModal() {
        document.getElementById('modal').classList.add('hidden');
      }

      window.onload = () => {
        loadLevel(currentLevelIdx);
      };
    </script>
  </body>
</html>
